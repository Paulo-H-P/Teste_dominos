name: E2E Tests - Allure HTML to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

concurrency:
  group: e2e-dominos
  cancel-in-progress: true

jobs:
  e2e-allure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write
    
    env:
      QASE_MODE: testops
      QASE_API_TOKEN: ${{ secrets.QASE_TOKEN }}
      QASE_PROJECT_CODE: DOMINOS
      CYPRESS_BASE_URL: https://app.dominos.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify npm and package-lock.json
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Checking package-lock.json..."
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json não encontrado!"
            exit 1
          fi
          echo "✅ package-lock.json encontrado"

      - name: Clear Cypress cache (force fresh install)
        run: |
          rm -rf node_modules/.cache
          rm -rf ~/.cache/Cypress
          echo "✅ Cache limpo"

      - name: Install dependencies
        run: |
          npm ci || {
            echo "⚠️ npm ci falhou, tentando npm install..."
            npm install
          }

      - name: Run Cypress tests
        id: cypress
        shell: bash
        run: |
          export TERM=xterm
          
          echo "🚀 ========================================="
          echo "🚀 INICIANDO TESTES CYPRESS"
          echo "🚀 ========================================="
          echo ""
          echo "📋 Informações do ambiente:"
          echo "   Node version: $(node --version)"
          echo "   NPM version: $(npm --version)"
          echo "   Cypress version: $(npx cypress --version || echo 'Cypress not found')"
          echo "   Timestamp: $(date)"
          echo ""
          echo "📁 Arquivos de teste encontrados:"
          find cypress/e2e -name "*.cy.js" -o -name "*.spec.js" | head -10
          echo ""
          echo "⏳ Executando testes (isso pode levar alguns minutos)..."
          echo "   💡 Dica: Os logs abaixo mostram o progresso em tempo real"
          echo "   💡 Cada etapa do teste será exibida conforme executa"
          echo "   💡 Atualize a página para ver logs mais recentes"
          echo ""
          
          # Desabilita exit on error para capturar exit code corretamente
          set +e
          
          # Run Cypress with Chrome - mostra logs detalhados em tempo real
          echo "🔄 Iniciando execução do Cypress..."
          echo "   Timestamp: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "   Os logs abaixo mostram cada etapa do teste conforme executa"
          echo "   💡 IMPORTANTE: Atualize a página periodicamente para ver logs mais recentes"
          echo ""
          
          # Executa Cypress com reporter do Qase (os logs aparecem em tempo real no GitHub Actions)
          npx cypress run --browser chrome
          exit_code=$?
          
          # Reabilita exit on error
          set -e
          
          echo ""
          echo "✅ ========================================="
          echo "✅ TESTES CONCLUÍDOS"
          echo "✅ ========================================="
          echo "   Exit code: $exit_code"
          echo "   Timestamp: $(date)"
          echo ""
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          
          # List allure-results if they exist
          if [ -d "allure-results" ]; then
            echo "Allure results found: $(ls -la allure-results | wc -l) files"
            ls -la allure-results | head -10
          else
            echo "Warning: allure-results directory not found"
          fi
          
          # Always exit 0 to continue workflow (para gerar relatório mesmo se falhar)
          exit 0

      - name: Generate Qase HTML report
        if: always()
        shell: bash
        run: |
          echo "📊 Gerando relatório HTML para o Qase..."
          node scripts/generate-qase-report.js || echo "⚠️ Erro ao gerar relatório Qase, continuando..."
          if [ -d "qase-report" ]; then
            echo "✅ Relatório Qase gerado com sucesso"
            ls -la qase-report/
            # Copiar relatório para screenshots para ser anexado pelo Qase
            mkdir -p cypress/screenshots
            cp qase-report/index.html cypress/screenshots/qase-report.html || echo "⚠️ Erro ao copiar relatório"
          else
            echo "⚠️ Diretório qase-report não encontrado"
          fi
          
          # Verificar se vídeos foram gerados
          if [ -d "cypress/videos" ]; then
            echo "📹 Vídeos encontrados:"
            ls -lh cypress/videos/ || echo "Nenhum vídeo encontrado"
          fi

      - name: Generate Allure HTML report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Generating Allure report from allure-results..."
            npx allure-commandline generate allure-results --clean -o allure-report || {
              echo "Error generating Allure report. Creating fallback..."
              mkdir -p allure-report
              echo "<!DOCTYPE html><html><head><title>Allure Report Error</title></head><body><h1>Error generating Allure report</h1><p>Failed to generate report from allure-results.</p></body></html>" > allure-report/index.html
            }
            echo "Allure report generated successfully"
          else
            echo "No allure-results found or directory is empty. Creating placeholder..."
            mkdir -p allure-report
            echo "<!DOCTYPE html><html><head><title>No Test Results</title></head><body><h1>No allure-results generated</h1><p>No test results were found to generate the report.</p></body></html>" > allure-report/index.html
          fi

      - name: Verify report directory
        if: always()
        shell: bash
        run: |
          if [ ! -d "allure-report" ]; then
            echo "Error: allure-report directory does not exist"
            exit 1
          fi
          if [ ! -f "allure-report/index.html" ]; then
            echo "Warning: allure-report/index.html not found. Creating it..."
            echo "<!DOCTYPE html><html><head><title>Allure Report</title></head><body><h1>Allure Report</h1></body></html>" > allure-report/index.html
          fi
          echo "Report directory verified. Files:"
          ls -la allure-report/ | head -10

      - name: Create README for artifact
        if: always()
        shell: bash
        run: |
          cat > allure-report/README.md << 'EOF'
          # 📊 Relatório Allure de Testes
          
          Este é o relatório HTML gerado pelo Allure Report para os testes E2E executados no GitHub Actions.
          
          ## 📖 Como visualizar
          
          1. **GitHub Pages (Recomendado):**
             - Acesse: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
             - O relatório está disponível online e atualizado automaticamente
          
          2. **Download do Artifact:**
             - Baixe o artifact `allure-report` na seção de Artifacts desta execução
             - Extraia o arquivo ZIP
             - Abra o arquivo `index.html` em um navegador moderno
             - **Nota:** Alguns recursos podem não funcionar localmente devido a restrições CORS
          
          ## 📋 Informações da Execução
          
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Workflow:** ${{ github.workflow }}
          - **Executado em:** ${{ github.event.head_commit.timestamp }}
          
          ## 🔍 Estrutura do Relatório
          
          - `index.html` - Página principal do relatório
          - `data/` - Dados dos testes em formato JSON
          - `widgets/` - Widgets e gráficos do relatório
          - `history/` - Histórico de execuções anteriores
          
          ## ⚠️ Nota Importante
          
          Para visualização completa, recomenda-se usar o GitHub Pages ou executar um servidor HTTP local:
          ```bash
          # Com Python
          python -m http.server 8000
          
          # Com Node.js
          npx http-server allure-report -p 8000
          ```
          EOF
          echo "README.md created in allure-report directory"

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Get GitHub Pages URL
        if: always()
        id: pages-url
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          USER_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          # GitHub Pages URL para repositórios de usuário
          PAGES_URL="https://${USER_NAME}.github.io/${REPO_NAME}/"
          echo "url=$PAGES_URL" >> $GITHUB_OUTPUT
          echo "📊 GitHub Pages URL: $PAGES_URL"
          echo ""
          echo "ℹ️ IMPORTANTE: Para o GitHub Pages funcionar, você precisa:"
          echo "   1. Ir em Settings > Pages do repositório"
          echo "   2. Selecionar 'Deploy from a branch'"
          echo "   3. Escolher a branch 'gh-pages' e pasta '/ (root)'"
          echo "   4. Salvar as configurações"
          echo ""
          echo "🔗 URL esperada: $PAGES_URL"

      - name: Create workflow summary
        if: always()
        run: |
          echo "## 📊 Relatório Allure de Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Status dos Testes" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cypress.outputs.exit_code }}" == "0" ]; then
            echo "✅ **Todos os testes passaram com sucesso!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Alguns testes falharam** (Exit code: ${{ steps.cypress.outputs.exit_code }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Acessar Relatório" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 **GitHub Pages:** [${{ steps.pages-url.outputs.url }}](${{ steps.pages-url.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Se o link retornar 404, configure o GitHub Pages:**" >> $GITHUB_STEP_SUMMARY
          echo "   1. Vá em **Settings > Pages** do repositório" >> $GITHUB_STEP_SUMMARY
          echo "   2. Em **Source**, selecione **Deploy from a branch**" >> $GITHUB_STEP_SUMMARY
          echo "   3. Escolha a branch **gh-pages** e pasta **/ (root)**" >> $GITHUB_STEP_SUMMARY
          echo "   4. Clique em **Save**" >> $GITHUB_STEP_SUMMARY
          echo "   5. Aguarde alguns minutos para o site ficar disponível" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Download do Artifact:** Disponível na seção de Artifacts desta execução" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Informações" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Executado em:** \`${{ github.event.head_commit.timestamp }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Verify GitHub Pages deployment
        if: always()
        run: |
          echo "Verificando se o deploy foi bem-sucedido..."
          sleep 5
          echo "📝 Nota: O GitHub Pages pode levar alguns minutos para ficar disponível após o deploy"
          echo "📝 Se ainda estiver com 404, verifique:"
          echo "   1. Se o GitHub Pages está habilitado nas configurações do repositório"
          echo "   2. Se a branch 'gh-pages' foi criada"
          echo "   3. Se o source está configurado para 'gh-pages' branch"
          echo ""
          echo "🔗 URL esperada: ${{ steps.pages-url.outputs.url }}"

      - name: Notify Telegram (E2E status)
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.cypress.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=1; fi

          if [ "$EXIT_CODE" = "0" ]; then
            STATUS="✅ PASSOU"
          else
            STATUS="❌ FALHOU (exit: $EXIT_CODE)"
          fi

          MESSAGE="E2E Dominos - ${STATUS}"$'\n\n'"Repo: ${{ github.repository }}"$'\n'"Branch: ${{ github.ref_name }}"$'\n'"Commit: ${{ github.sha }}"$'\n'"Relatório: ${{ steps.pages-url.outputs.url }}"$'\n'"Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Verifica se os secrets estão configurados antes de tentar enviar
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "⚠️ Secrets do Telegram não configurados - pulando notificação"
            exit 0
          fi

          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "disable_web_page_preview=true" 2>&1)

          # Verifica se houve erro (mas não quebra o workflow)
          if echo "$RESPONSE" | grep -q '"ok":false'; then
            echo "⚠️ Erro ao enviar notificação Telegram: $RESPONSE"
            echo "⚠️ Verifique se TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID estão configurados corretamente"
          else
            echo "✅ Notificação Telegram enviada com sucesso"
          fi

      - name: Report test status
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.cypress.outputs.exit_code }}"
          
          # Fallback: se exit_code estiver vazio, assume falha
          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE=1
            echo "⚠️ Exit code não foi capturado, assumindo falha (1)"
          fi
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "⚠️ ========================================="
            echo "⚠️ Cypress tests failed with exit code $EXIT_CODE"
            echo "⚠️ ========================================="
            echo ""
            echo "📊 IMPORTANTE: O relatório foi gerado e publicado com sucesso!"
            echo "📄 GitHub Pages: ${{ steps.pages-url.outputs.url }}"
            echo "📦 Artifact: Disponível na seção de Artifacts desta execução"
            echo ""
            echo "🔍 Verifique o relatório Allure para detalhes das falhas:"
            echo "   - Screenshots dos erros"
            echo "   - Logs detalhados"
            echo "   - Stack traces"
            echo ""
            echo "⚠️ Este workflow falha para indicar que houve problemas nos testes,"
            echo "   mas o relatório completo está disponível para análise."
            exit 1
          else
            echo "✅ ========================================="
            echo "✅ Todos os testes Cypress passaram com sucesso!"
            echo "✅ ========================================="
            echo ""
            echo "📊 Relatório disponível em: ${{ steps.pages-url.outputs.url }}"
          fi

      - name: Send test result e-mail
        if: always()  # executa independentemente do resultado dos testes
        continue-on-error: true  # Não falha o workflow se o e-mail falhar
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "E2E Dominos – Status: ${{ job.status }} – ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFICATION_EMAILS }}
          from: GitHub CI <${{ secrets.EMAIL_USERNAME }}>
          secure: false
          html_body: |
            <html>
            <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
              <h2 style="color: #2c3e50;">📊 Relatório de Testes E2E - Dominos</h2>
              
              <div style="background-color: ${{ job.status == 'success' && '#d4edda' || '#f8d7da' }}; padding: 15px; border-radius: 5px; margin: 20px 0;">
                <p style="margin: 0; font-size: 18px;">
                  <strong>Status da execução:</strong> 
                  <span style="color: ${{ job.status == 'success' && '#155724' || '#721c24' }};">
                    ${{ job.status == 'success' && '✅ SUCESSO' || '❌ FALHA' }}
                  </span>
                </p>
              </div>
              
              <h3 style="color: #2c3e50;">📋 Informações da Execução</h3>
              <ul>
                <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
                <li><strong>Commit:</strong> <code>${{ github.sha }}</code></li>
                <li><strong>Workflow:</strong> ${{ github.workflow }}</li>
                <li><strong>Executado em:</strong> ${{ github.event.head_commit.timestamp }}</li>
              </ul>
              
              <h3 style="color: #2c3e50;">🔗 Links Úteis</h3>
              <ul>
                <li>
                  <strong>Relatório Allure:</strong> 
                  <a href="${{ steps.pages-url.outputs.url }}" style="color: #007bff; text-decoration: none;">
                    ${{ steps.pages-url.outputs.url }}
                  </a>
                </li>
                <li>
                  <strong>Logs do Workflow:</strong> 
                  <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color: #007bff; text-decoration: none;">
                    Ver logs completos
                  </a>
                </li>
                <li>
                  <strong>Qase Test Run:</strong> 
                  <a href="https://app.qase.io/run/DOMINOS/dashboard" style="color: #007bff; text-decoration: none;">
                    Ver no Qase
                  </a>
                </li>
              </ul>
              
              <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
              
              <p style="color: #666; font-size: 12px;">
                Esta é uma notificação automática do GitHub Actions.<br>
                Repositório: <a href="https://github.com/${{ github.repository }}" style="color: #007bff;">${{ github.repository }}</a>
              </p>
            </body>
            </html>

