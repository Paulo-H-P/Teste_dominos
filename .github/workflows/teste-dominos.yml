name: E2E Tests - Allure HTML to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

concurrency:
  group: e2e-dominos
  cancel-in-progress: true

jobs:
  e2e-allure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
      id-token: write
    
    env:
      QASE_MODE: testops
      QASE_API_TOKEN: ${{ secrets.QASE_TOKEN || secrets.QASE_API_TOKEN }}
      QASE_PROJECT_CODE: DOMINOS
      CYPRESS_BASE_URL: https://app.dominos.com.br

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify npm and package-lock.json
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Checking package-lock.json..."
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json não encontrado!"
            exit 1
          fi
          echo "✅ package-lock.json encontrado"

      - name: Verify Qase configuration
        run: |
          if [ -z "${{ secrets.QASE_TOKEN }}" ] && [ -z "${{ secrets.QASE_API_TOKEN }}" ]; then
            echo "⚠️ ATENÇÃO: QASE_TOKEN ou QASE_API_TOKEN não está configurado!"
            echo "📋 Para configurar:"
            echo "   1. Acesse: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "   2. Crie um secret chamado 'QASE_TOKEN'"
            echo "   3. Cole o token do Qase (obtenha em: https://app.qase.io/settings/api)"
            echo "⚠️ Os testes continuarão, mas os resultados NÃO serão enviados ao Qase"
          else
            echo "✅ Qase token configurado"
          fi

      - name: Clear Cypress cache (force fresh install)
        run: |
          rm -rf node_modules/.cache
          rm -rf ~/.cache/Cypress
          echo "✅ Cache limpo"

      - name: Install dependencies
        run: |
          npm ci || {
            echo "⚠️ npm ci falhou, tentando npm install..."
            npm install
          }

      - name: Run Cypress tests
        id: cypress
        shell: bash
        continue-on-error: true
        run: |
          export TERM=xterm
          
          echo "🚀 ========================================="
          echo "🚀 INICIANDO TESTES CYPRESS"
          echo "🚀 ========================================="
          echo ""
          echo "📋 Informações do ambiente:"
          echo "   Node version: $(node --version)"
          echo "   NPM version: $(npm --version)"
          echo "   Cypress version: $(npx cypress --version || echo 'Cypress not found')"
          echo "   Timestamp: $(date)"
          echo ""
          echo "📁 Arquivos de teste encontrados:"
          find cypress/e2e -name "*.cy.js" -o -name "*.spec.js" | head -10
          echo ""
          echo "⏳ Executando testes (isso pode levar alguns minutos)..."
          echo "   💡 Dica: Os logs abaixo mostram o progresso em tempo real"
          echo "   💡 Cada etapa do teste será exibida conforme executa"
          echo "   💡 Atualize a página para ver logs mais recentes"
          echo ""
          
          # Desabilita exit on error para capturar exit code corretamente
          set +e
          
          # Inicializa exit_code com valor padrão (assume falha se não for capturado)
          exit_code=1
          
          # Captura tempo de início
          start_time=$(date +%s)
          echo "🔄 Iniciando execução do Cypress..."
          echo "   Timestamp: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "   Os logs abaixo mostram cada etapa do teste conforme executa"
          echo "   💡 IMPORTANTE: Atualize a página periodicamente para ver logs mais recentes"
          echo ""
          
          # Executa Cypress com reporter do Qase (os logs aparecem em tempo real no GitHub Actions)
          npx cypress run --browser chrome || true  # Não falha o script mesmo se Cypress falhar
          cypress_exit=$?
          
          # Captura exit_code (se Cypress foi cancelado, cypress_exit pode estar vazio)
          if [ -n "$cypress_exit" ] && [ "$cypress_exit" != "" ]; then
            exit_code=$cypress_exit
          else
            exit_code=1  # Assume falha se não foi capturado
          fi
          
          # IMPORTANTE: Captura tempo de fim e calcula duração SEMPRE, mesmo se houver erro
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          duration_minutes=$((duration / 60))
          duration_seconds=$((duration % 60))
          duration_seconds_formatted=$(printf "%02d" $duration_seconds)
          
          # Limite de tempo: 3:30 minutos = 210 segundos
          time_limit=210
          time_exceeded=false
          
          if [ $duration -gt $time_limit ]; then
            time_exceeded=true
            echo ""
            echo "⚠️ ========================================="
            echo "⚠️ ATENÇÃO: TESTE ULTRAPASSOU O LIMITE DE TEMPO"
            echo "⚠️ ========================================="
            echo "   Tempo limite: 3:30 minutos (210 segundos)"
            echo "   Tempo de execução: ${duration_minutes}:${duration_seconds_formatted} minutos"
            echo "   Diferença: $((duration - time_limit)) segundos acima do limite"
            echo ""
          fi
          
          echo ""
          echo "✅ ========================================="
          echo "✅ TESTES CONCLUÍDOS"
          echo "✅ ========================================="
          echo "   Exit code: $exit_code"
          echo "   Duração: ${duration_minutes}:${duration_seconds_formatted} minutos"
          echo "   Timestamp: $(date)"
          echo ""
          
          # IMPORTANTE: Salvar variáveis no GITHUB_OUTPUT - fazer isso ANTES de qualquer exit
          # Usar >> para append e garantir que não sobrescreva outras variáveis
          {
            echo "exit_code=$exit_code"
            echo "duration=$duration"
            echo "duration_minutes=$duration_minutes"
            echo "duration_seconds=$duration_seconds"
            echo "duration_seconds_formatted=$duration_seconds_formatted"
            echo "time_exceeded=$time_exceeded"
          } >> "$GITHUB_OUTPUT"
          
          echo "📤 Variáveis definidas no GITHUB_OUTPUT:"
          cat "$GITHUB_OUTPUT" | tail -6 || echo "⚠️ Não foi possível ler GITHUB_OUTPUT"
          
          # List allure-results if they exist
          if [ -d "allure-results" ]; then
            echo "Allure results found: $(ls -la allure-results | wc -l) files"
            ls -la allure-results | head -10
          else
            echo "Warning: allure-results directory not found"
          fi
          
          # Reabilita exit on error apenas no final
          set -e
          
          # Always exit 0 to continue workflow (para gerar relatório mesmo se falhar)
          # Mas primeiro desabilita novamente para garantir que não falhe
          set +e
          exit 0

      - name: Extract Qase run ID and generate link
        if: always()
        shell: bash
        id: qase-link
        run: |
          echo "🔍 Extraindo Run ID do Qase dos logs..."
          
          # O Qase geralmente mostra nos logs: [DEBUG] qase: Test run created: {"status":true,"result":{"id":XXX}}
          # Ou: [INFO] qase: Test run link: https://app.qase.io/run/DOMINOS/dashboard/XXX
          
          QASE_RUN_ID=""
          QASE_LINK="https://app.qase.io/project/DOMINOS/runs"
          
          # Tentar encontrar o run ID em arquivos de log ou saída do Cypress
          # Procurar por padrões comuns nos logs
          if [ -f "cypress.log" ]; then
            QASE_RUN_ID=$(grep -oP '"id":\s*\K\d+' cypress.log 2>/dev/null | head -1 || echo "")
          fi
          
          # Se não encontrou, tentar buscar em qualquer arquivo que possa conter logs
          if [ -z "$QASE_RUN_ID" ]; then
            # Procurar por "Test run created" ou "Test run link" em arquivos
            QASE_RUN_ID=$(find . -type f -name "*.log" -o -name "*.txt" 2>/dev/null | xargs grep -h "Test run created\|Test run link" 2>/dev/null | grep -oP '"id":\s*\K\d+' | head -1 || echo "")
          fi
          
          # Se ainda não encontrou, usar link genérico (sempre funciona)
          if [ -n "$QASE_RUN_ID" ] && [ "$QASE_RUN_ID" != "" ]; then
            QASE_LINK="https://app.qase.io/project/DOMINOS/runs/$QASE_RUN_ID"
            echo "✅ Run ID encontrado: $QASE_RUN_ID"
            echo "🔗 Link do Qase: $QASE_LINK"
          else
            echo "ℹ️ Run ID não encontrado nos logs"
            echo "🔗 Usando link genérico para página de runs: $QASE_LINK"
            echo "   (Este link sempre funciona e mostra todos os runs do projeto)"
          fi
          
          echo "qase_link=$QASE_LINK" >> "$GITHUB_OUTPUT"
          echo "qase_run_id=$QASE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Generate Qase HTML report
        if: always()
        shell: bash
        run: |
          echo "📊 Gerando relatório HTML para o Qase..."
          node scripts/generate-qase-report.js || echo "⚠️ Erro ao gerar relatório Qase, continuando..."
          if [ -d "qase-report" ]; then
            echo "✅ Relatório Qase gerado com sucesso"
            ls -la qase-report/
            # Copiar relatório para screenshots para ser anexado pelo Qase
            mkdir -p cypress/screenshots
            cp qase-report/index.html cypress/screenshots/qase-report.html || echo "⚠️ Erro ao copiar relatório"
          else
            echo "⚠️ Diretório qase-report não encontrado"
          fi
          
          # Verificar se vídeos foram gerados
          if [ -d "cypress/videos" ]; then
            echo "📹 Vídeos encontrados:"
            ls -lh cypress/videos/ || echo "Nenhum vídeo encontrado"
          fi

      - name: Generate Allure HTML report
        if: always()
        shell: bash
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Generating Allure report from allure-results..."
            npx allure-commandline generate allure-results --clean -o allure-report || {
              echo "Error generating Allure report. Creating fallback..."
              mkdir -p allure-report
              echo "<!DOCTYPE html><html><head><title>Allure Report Error</title></head><body><h1>Error generating Allure report</h1><p>Failed to generate report from allure-results.</p></body></html>" > allure-report/index.html
            }
            echo "Allure report generated successfully"
          else
            echo "No allure-results found or directory is empty. Creating placeholder..."
            mkdir -p allure-report
            echo "<!DOCTYPE html><html><head><title>No Test Results</title></head><body><h1>No allure-results generated</h1><p>No test results were found to generate the report.</p></body></html>" > allure-report/index.html
          fi

      - name: Verify report directory
        if: always()
        shell: bash
        run: |
          if [ ! -d "allure-report" ]; then
            echo "Error: allure-report directory does not exist"
            exit 1
          fi
          if [ ! -f "allure-report/index.html" ]; then
            echo "Warning: allure-report/index.html not found. Creating it..."
            echo "<!DOCTYPE html><html><head><title>Allure Report</title></head><body><h1>Allure Report</h1></body></html>" > allure-report/index.html
          fi
          echo "Report directory verified. Files:"
          ls -la allure-report/ | head -10

      - name: Create README for artifact
        if: always()
        shell: bash
        run: |
          cat > allure-report/README.md << 'EOF'
          # 📊 Relatório Allure de Testes
          
          Este é o relatório HTML gerado pelo Allure Report para os testes E2E executados no GitHub Actions.
          
          ## 📖 Como visualizar
          
          1. **GitHub Pages (Recomendado):**
             - Acesse: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
             - O relatório está disponível online e atualizado automaticamente
          
          2. **Download do Artifact:**
             - Baixe o artifact `allure-report` na seção de Artifacts desta execução
             - Extraia o arquivo ZIP
             - Abra o arquivo `index.html` em um navegador moderno
             - **Nota:** Alguns recursos podem não funcionar localmente devido a restrições CORS
          
          ## 📋 Informações da Execução
          
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Workflow:** ${{ github.workflow }}
          - **Executado em:** ${{ github.event.head_commit.timestamp }}
          
          ## 🔍 Estrutura do Relatório
          
          - `index.html` - Página principal do relatório
          - `data/` - Dados dos testes em formato JSON
          - `widgets/` - Widgets e gráficos do relatório
          - `history/` - Histórico de execuções anteriores
          
          ## ⚠️ Nota Importante
          
          Para visualização completa, recomenda-se usar o GitHub Pages ou executar um servidor HTTP local:
          ```bash
          # Com Python
          python -m http.server 8000
          
          # Com Node.js
          npx http-server allure-report -p 8000
          ```
          EOF
          echo "README.md created in allure-report directory"

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Get GitHub Pages URL
        if: always()
        id: pages-url
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          USER_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          # GitHub Pages URL para repositórios de usuário
          PAGES_URL="https://${USER_NAME}.github.io/${REPO_NAME}/"
          echo "url=$PAGES_URL" >> $GITHUB_OUTPUT
          echo "📊 GitHub Pages URL: $PAGES_URL"
          echo ""
          echo "ℹ️ IMPORTANTE: Para o GitHub Pages funcionar, você precisa:"
          echo "   1. Ir em Settings > Pages do repositório"
          echo "   2. Selecionar 'Deploy from a branch'"
          echo "   3. Escolher a branch 'gh-pages' e pasta '/ (root)'"
          echo "   4. Salvar as configurações"
          echo ""
          echo "🔗 URL esperada: $PAGES_URL"

      - name: Create workflow summary
        if: always()
        run: |
          echo "## 📊 Relatório Allure de Testes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Status dos Testes" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.cypress.outputs.exit_code }}" == "0" ]; then
            echo "✅ **Todos os testes passaram com sucesso!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Alguns testes falharam** (Exit code: ${{ steps.cypress.outputs.exit_code }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Acessar Relatório" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 **GitHub Pages:** [${{ steps.pages-url.outputs.url }}](${{ steps.pages-url.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Se o link retornar 404, configure o GitHub Pages:**" >> $GITHUB_STEP_SUMMARY
          echo "   1. Vá em **Settings > Pages** do repositório" >> $GITHUB_STEP_SUMMARY
          echo "   2. Em **Source**, selecione **Deploy from a branch**" >> $GITHUB_STEP_SUMMARY
          echo "   3. Escolha a branch **gh-pages** e pasta **/ (root)**" >> $GITHUB_STEP_SUMMARY
          echo "   4. Clique em **Save**" >> $GITHUB_STEP_SUMMARY
          echo "   5. Aguarde alguns minutos para o site ficar disponível" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Download do Artifact:** Disponível na seção de Artifacts desta execução" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Informações" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Executado em:** \`${{ github.event.head_commit.timestamp }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Verify GitHub Pages deployment
        if: always()
        run: |
          echo "Verificando se o deploy foi bem-sucedido..."
          sleep 5
          echo "📝 Nota: O GitHub Pages pode levar alguns minutos para ficar disponível após o deploy"
          echo "📝 Se ainda estiver com 404, verifique:"
          echo "   1. Se o GitHub Pages está habilitado nas configurações do repositório"
          echo "   2. Se a branch 'gh-pages' foi criada"
          echo "   3. Se o source está configurado para 'gh-pages' branch"
          echo ""
          echo "🔗 URL esperada: ${{ steps.pages-url.outputs.url }}"

      - name: Report test status
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.cypress.outputs.exit_code }}"
          
          # Fallback: se exit_code estiver vazio, assume falha
          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE=1
            echo "⚠️ Exit code não foi capturado, assumindo falha (1)"
          fi
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "⚠️ ========================================="
            echo "⚠️ Cypress tests failed with exit code $EXIT_CODE"
            echo "⚠️ ========================================="
            echo ""
            echo "📊 IMPORTANTE: O relatório foi gerado e publicado com sucesso!"
            echo "📄 GitHub Pages: ${{ steps.pages-url.outputs.url }}"
            echo "📦 Artifact: Disponível na seção de Artifacts desta execução"
            echo ""
            echo "🔍 Verifique o relatório Allure para detalhes das falhas:"
            echo "   - Screenshots dos erros"
            echo "   - Logs detalhados"
            echo "   - Stack traces"
            echo ""
            echo "⚠️ Este workflow falha para indicar que houve problemas nos testes,"
            echo "   mas o relatório completo está disponível para análise."
            exit 1
          else
            echo "✅ ========================================="
            echo "✅ Todos os testes Cypress passaram com sucesso!"
            echo "✅ ========================================="
            echo ""
            echo "📊 Relatório disponível em: ${{ steps.pages-url.outputs.url }}"
          fi

      - name: Debug outputs
        if: always()
        shell: bash
        run: |
          echo "🔍 Debug - Valores das saídas do step cypress:"
          echo "   exit_code: '${{ steps.cypress.outputs.exit_code }}'"
          echo "   duration: '${{ steps.cypress.outputs.duration }}'"
          echo "   duration_minutes: '${{ steps.cypress.outputs.duration_minutes }}'"
          echo "   duration_seconds: '${{ steps.cypress.outputs.duration_seconds }}'"
          echo "   duration_seconds_formatted: '${{ steps.cypress.outputs.duration_seconds_formatted }}'"
          echo "   time_exceeded: '${{ steps.cypress.outputs.time_exceeded }}'"

      - name: Analyze delay reason
        if: always()
        shell: bash
        id: analyze-delay
        run: |
          EXIT_CODE="${{ steps.cypress.outputs.exit_code }}"
          TIME_EXCEEDED="${{ steps.cypress.outputs.time_exceeded }}"
          
          delay_reason=""
          
          if [ "$TIME_EXCEEDED" = "true" ]; then
            echo "🔍 Analisando motivo da demora..."
            
            # Verificar se há resultados do Allure para analisar
            if [ -d "allure-results" ]; then
              # Contar testes que falharam
              failed_tests=$(find allure-results -name "*.json" -type f -exec grep -l '"status":"failed"' {} \; 2>/dev/null | wc -l || echo "0")
              
              if [ "$failed_tests" -gt 0 ]; then
                echo "   📊 Encontrados $failed_tests teste(s) falhado(s)"
                
                # Tentar identificar os testes que falharam e seus erros
                failed_test_names=$(find allure-results -name "*.json" -type f -exec grep -l '"status":"failed"' {} \; 2>/dev/null | head -3 | while read file; do
                  test_name=$(grep -o '"name":"[^"]*"' "$file" 2>/dev/null | head -1 | sed 's/"name":"\([^"]*\)"/\1/' || echo "")
                  error_msg=$(grep -o '"message":"[^"]*"' "$file" 2>/dev/null | head -1 | sed 's/"message":"\([^"]*\)"/\1/' | cut -c1-100 || echo "")
                  if [ -n "$test_name" ]; then
                    echo "      - $test_name"
                    if [ -n "$error_msg" ]; then
                      echo "        Erro: $error_msg"
                    fi
                  fi
                done || echo "")
                
                delay_reason="<strong>Testes falharam durante a execução:</strong><br>"
                delay_reason="${delay_reason}<ul>"
                
                # Analisar erros comuns
                timeout_errors=$(find allure-results -name "*.json" -type f -exec grep -l "Timed out\|timeout\|ECONNREFUSED" {} \; 2>/dev/null | wc -l || echo "0")
                element_not_found=$(find allure-results -name "*.json" -type f -exec grep -l "Expected to find element\|never found it" {} \; 2>/dev/null | wc -l || echo "0")
                connection_errors=$(find allure-results -name "*.json" -type f -exec grep -l "ECONNREFUSED\|connection\|network" {} \; 2>/dev/null | wc -l || echo "0")
                
                if [ "$timeout_errors" -gt 0 ]; then
                  delay_reason="${delay_reason}<li><strong>Timeouts detectados:</strong> $timeout_errors teste(s) falharam por timeout (elementos não carregaram a tempo)</li>"
                fi
                
                if [ "$element_not_found" -gt 0 ]; then
                  delay_reason="${delay_reason}<li><strong>Elementos não encontrados:</strong> $element_not_found teste(s) falharam porque elementos esperados não foram encontrados na página</li>"
                fi
                
                if [ "$connection_errors" -gt 0 ]; then
                  delay_reason="${delay_reason}<li><strong>Problemas de conexão:</strong> $connection_errors teste(s) falharam por problemas de rede/conexão</li>"
                fi
                
                if [ "$EXIT_CODE" != "0" ]; then
                  delay_reason="${delay_reason}<li><strong>Execução interrompida:</strong> O teste foi cancelado ou interrompido antes de completar</li>"
                fi
                
                delay_reason="${delay_reason}</ul>"
                delay_reason="${delay_reason}<p><em>💡 Verifique os screenshots anexados e o relatório Allure para mais detalhes.</em></p>"
              else
                delay_reason="<p><strong>Possíveis causas da demora:</strong></p>"
                delay_reason="${delay_reason}<ul>"
                delay_reason="${delay_reason}<li>Carregamento lento da aplicação</li>"
                delay_reason="${delay_reason}<li>Timeouts em elementos da página</li>"
                delay_reason="${delay_reason}<li>Problemas de rede ou conectividade</li>"
                delay_reason="${delay_reason}<li>Recursos pesados sendo carregados</li>"
                delay_reason="${delay_reason}</ul>"
              fi
            else
              delay_reason="<p><strong>Possíveis causas da demora:</strong></p>"
              delay_reason="${delay_reason}<ul>"
              delay_reason="${delay_reason}<li>Carregamento lento da aplicação</li>"
              delay_reason="${delay_reason}<li>Timeouts em elementos da página</li>"
              delay_reason="${delay_reason}<li>Problemas de rede ou conectividade</li>"
              delay_reason="${delay_reason}</ul>"
            fi
          fi
          
          # Salvar no output (escapar quebras de linha para HTML)
          echo "delay_reason<<EOF" >> "$GITHUB_OUTPUT"
          echo "$delay_reason" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          
          if [ -n "$delay_reason" ]; then
            echo "✅ Motivo da demora analisado e salvo"
          else
            echo "ℹ️ Nenhum motivo de demora identificado (teste não ultrapassou o limite)"
          fi

      - name: Format duration for email
        if: always()
        shell: bash
        id: format-duration
        run: |
          duration_minutes="${{ steps.cypress.outputs.duration_minutes }}"
          duration_seconds_formatted="${{ steps.cypress.outputs.duration_seconds_formatted }}"
          
          echo "🔍 Formatando duração:"
          echo "   duration_minutes: '$duration_minutes'"
          echo "   duration_seconds_formatted: '$duration_seconds_formatted'"
          
          if [ -z "$duration_minutes" ] || [ "$duration_minutes" = "" ] || [ -z "$duration_seconds_formatted" ] || [ "$duration_seconds_formatted" = "" ]; then
            echo "⚠️ Duração não disponível, usando N/A"
            echo "duration_formatted=N/A" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Duração formatada: ${duration_minutes}:${duration_seconds_formatted}"
            echo "duration_formatted=${duration_minutes}:${duration_seconds_formatted}" >> "$GITHUB_OUTPUT"
          fi
          
          echo "📤 Saída final: duration_formatted='$(cat $GITHUB_OUTPUT | grep duration_formatted || echo 'N/A')'"

      - name: Collect error screenshots for email
        if: always()
        shell: bash
        id: collect-screenshots
        run: |
          EXIT_CODE="${{ steps.cypress.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=1; fi
          
          echo "📸 Coletando screenshots de erro para anexar no e-mail..."
          echo "   Exit code: $EXIT_CODE"
          
          # Só coleta screenshots se houve falha
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ Testes passaram - não há screenshots de erro para anexar"
            echo "has_screenshots=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Criar diretório temporário para screenshots de erro
          mkdir -p email-screenshots
          
          # Verificar se o diretório de screenshots existe
          if [ ! -d "cypress/screenshots" ]; then
            echo "⚠️ Diretório cypress/screenshots não encontrado"
            echo "has_screenshots=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "🔍 Procurando screenshots em: cypress/screenshots"
          find cypress/screenshots -type f -name "*.png" | head -10
          
          # Encontrar todos os screenshots de falha (que contêm "failed" no nome)
          # Usar array para evitar problemas com subshells
          screenshot_files=()
          while IFS= read -r screenshot; do
            if [ -f "$screenshot" ]; then
              filename=$(basename "$screenshot")
              # Limpar nome do arquivo (remover caracteres especiais)
              clean_filename=$(echo "$filename" | sed 's/[^a-zA-Z0-9._-]/_/g')
              cp "$screenshot" "email-screenshots/$clean_filename"
              screenshot_files+=("email-screenshots/$clean_filename")
              echo "✅ Screenshot coletado: $clean_filename"
            fi
          done < <(find cypress/screenshots -type f \( -name "*failed*.png" -o -name "*error*.png" \) 2>/dev/null | head -5)
          
          # Se não encontrou screenshots com "failed", pega os últimos screenshots gerados
          if [ ${#screenshot_files[@]} -eq 0 ]; then
            echo "⚠️ Nenhum screenshot de falha encontrado, coletando últimos screenshots..."
            while IFS= read -r screenshot; do
              if [ -f "$screenshot" ]; then
                filename=$(basename "$screenshot")
                clean_filename=$(echo "$filename" | sed 's/[^a-zA-Z0-9._-]/_/g')
                cp "$screenshot" "email-screenshots/$clean_filename"
                screenshot_files+=("email-screenshots/$clean_filename")
                echo "✅ Screenshot coletado: $clean_filename"
                if [ ${#screenshot_files[@]} -ge 5 ]; then
                  break
                fi
              fi
            done < <(find cypress/screenshots -type f -name "*.png" -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -5 | cut -d' ' -f2-)
          fi
          
          # Listar screenshots coletados
          if [ ${#screenshot_files[@]} -gt 0 ]; then
            echo "📸 Screenshots coletados para e-mail (${#screenshot_files[@]} arquivos):"
            ls -lh email-screenshots/
            # Criar lista de anexos - a action espera caminhos separados por espaço
            attachments_list=$(printf '%s ' "${screenshot_files[@]}" | sed 's/[[:space:]]*$//')
            echo "attachments=$attachments_list" >> $GITHUB_OUTPUT
            echo "has_screenshots=true" >> $GITHUB_OUTPUT
            echo "📎 Lista de anexos (${#screenshot_files[@]} arquivos):"
            printf '  - %s\n' "${screenshot_files[@]}"
            echo "📎 String de anexos: $attachments_list"
            echo "📤 Debug - has_screenshots=true"
            echo "📤 Debug - attachments definido"
          else
            echo "⚠️ Nenhum screenshot encontrado para anexar"
            echo "has_screenshots=false" >> $GITHUB_OUTPUT
            echo "attachments=" >> $GITHUB_OUTPUT
            echo "📤 Debug - has_screenshots=false"
          fi
          
          # Debug: mostrar o que foi escrito no GITHUB_OUTPUT
          echo "📋 Conteúdo do GITHUB_OUTPUT relacionado a screenshots:"
          cat $GITHUB_OUTPUT | grep -E "(has_screenshots|attachments)" || echo "Nenhuma saída encontrada"

      - name: Debug before email
        if: always()
        shell: bash
        run: |
          echo "🔍 Debug antes de enviar e-mail:"
          echo "   has_screenshots: '${{ steps.collect-screenshots.outputs.has_screenshots }}'"
          echo "   attachments: '${{ steps.collect-screenshots.outputs.attachments }}'"
          echo "   duration_formatted: '${{ steps.format-duration.outputs.duration_formatted }}'"
          echo "   exit_code: '${{ steps.cypress.outputs.exit_code }}'"
          if [ -d "email-screenshots" ]; then
            echo "📸 Arquivos em email-screenshots:"
            ls -lh email-screenshots/ || echo "Diretório vazio ou não existe"
          else
            echo "⚠️ Diretório email-screenshots não existe"
          fi

      - name: Send test result e-mail
        if: always()  # executa independentemente do resultado dos testes
        continue-on-error: true  # Não falha o workflow se o e-mail falhar
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "E2E Dominos – Status: ${{ job.status }} – ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFICATION_EMAILS }}
          from: GitHub CI <${{ secrets.EMAIL_USERNAME }}>
          secure: false
          attachments: ${{ steps.collect-screenshots.outputs.has_screenshots == 'true' && steps.collect-screenshots.outputs.attachments || '' }}
          html_body: |
            <html>
            <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
              <h2 style="color: #2c3e50;">📊 Relatório de Testes E2E - Dominos</h2>
              
              <div style="background-color: ${{ job.status == 'success' && '#d4edda' || '#f8d7da' }}; padding: 15px; border-radius: 5px; margin: 20px 0;">
                <p style="margin: 0; font-size: 18px;">
                  <strong>Status da execução:</strong> 
                  <span style="color: ${{ job.status == 'success' && '#155724' || '#721c24' }};">
                    ${{ job.status == 'success' && '✅ SUCESSO' || '❌ FALHA' }}
                  </span>
                </p>
              </div>
              
              ${{ steps.cypress.outputs.time_exceeded == 'true' && '<div style="background-color: #fff3cd; border: 2px solid #ffc107; padding: 15px; border-radius: 5px; margin: 20px 0;"><p style="margin: 0; font-size: 16px; color: #856404;"><strong>⚠️ ATENÇÃO: TESTE ULTRAPASSOU O LIMITE DE TEMPO</strong></p><p style="margin: 10px 0 0 0; color: #856404;">O teste demorou <strong>' || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && steps.cypress.outputs.duration_minutes || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && ':' || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && steps.cypress.outputs.duration_seconds_formatted || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && ' minutos</strong> para finalizar o cadastro+login+compra, ultrapassando o limite de <strong>3:30 minutos</strong>.</p>' || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && steps.analyze-delay.outputs.delay_reason != '' && '<div style="margin-top: 15px; padding: 10px; background-color: #fff; border-left: 4px solid #ffc107; color: #856404;"><strong>🔍 Motivo da demora:</strong><br>' || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && steps.analyze-delay.outputs.delay_reason || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && steps.analyze-delay.outputs.delay_reason != '' && '</div>' || '' }}
              ${{ steps.cypress.outputs.time_exceeded == 'true' && '</div>' || '' }}
              
              <h3 style="color: #2c3e50;">📋 Informações da Execução</h3>
              <ul>
                <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
                <li><strong>Commit:</strong> <code>${{ github.sha }}</code></li>
                <li><strong>Workflow:</strong> ${{ github.workflow }}</li>
                <li><strong>Executado em:</strong> ${{ github.event.head_commit.timestamp }}</li>
                <li><strong>Duração:</strong> ${{ steps.format-duration.outputs.duration_formatted || 'N/A' }} minutos</li>
              </ul>
              
              ${{ steps.cypress.outputs.exit_code != '0' && '<h3 style="color: #2c3e50;">📸 Screenshots de Erro</h3><p>Os screenshots de erro foram anexados a este e-mail. Verifique os anexos para ver os detalhes das falhas.</p>' || '' }}
              
              <h3 style="color: #2c3e50;">🔗 Links Úteis</h3>
              <ul>
                <li>
                  <strong>Relatório Allure:</strong> 
                  <a href="${{ steps.pages-url.outputs.url }}" style="color: #007bff; text-decoration: none;">
                    ${{ steps.pages-url.outputs.url }}
                  </a>
                </li>
                <li>
                  <strong>Logs do Workflow:</strong> 
                  <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color: #007bff; text-decoration: none;">
                    Ver logs completos
                  </a>
                </li>
                <li>
                  <strong>Qase Test Run:</strong> 
                  <a href="${{ steps.qase-link.outputs.qase_link || 'https://app.qase.io/project/DOMINOS/runs' }}" style="color: #007bff; text-decoration: none;">
                    Ver no Qase${{ steps.qase-link.outputs.qase_run_id != '' && ' (Run #' || '' }}${{ steps.qase-link.outputs.qase_run_id || '' }}${{ steps.qase-link.outputs.qase_run_id != '' && ')' || '' }}
                  </a>
                </li>
              </ul>
              
              <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
              
              <p style="color: #666; font-size: 12px;">
                Esta é uma notificação automática do GitHub Actions.<br>
                Repositório: <a href="https://github.com/${{ github.repository }}" style="color: #007bff;">${{ github.repository }}</a>
              </p>
            </body>
            </html>

